name: Drain job queue

on:
  schedule:
    # Vercel Hobby cron is daily. This calls the app about every 10 minutes.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: drain-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the protected drain route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "APP_URL or CRON_SECRET is not set on this repository. Skipping."
            exit 0
          fi
          url="${APP_URL%/}/api/cron/drain"
          curl --fail-with-body --silent --show-error --max-time 70 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "${url}"
          echo
